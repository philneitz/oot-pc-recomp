name: Other bug
description: Building, audio, controls, movies, saves, performance or game logic.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the status file first.

        Do not attach or link game files, keys, firmware, builds, shader caches or screenshots of the game. Issues that do are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the status file and [searched open and closed issues](https://github.com/philneitz/oot-pc-recomp/issues?q=is%3Aissue) for this bug.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Building from source
        - Audio
        - Controls and input
        - Movies
        - Saves
        - Performance and stutter
        - Game logic
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit you built, from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened and how to reproduce it
      description: For a build problem, paste the command and the last lines of its output.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach logs\totk.log from the folder of oot.exe, if the game started.
